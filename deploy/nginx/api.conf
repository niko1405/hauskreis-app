# api.acts2.de → der NestJS-Container auf 127.0.0.1:3000
#
# Nach /etc/nginx/sites-available/ kopieren, den Namen ersetzen, verlinken:
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/acts2-api
#   sudo ln -s /etc/nginx/sites-available/acts2-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Den TLS-Teil schreibt certbot beim ersten Lauf selbst hinein
# (`certbot --nginx -d api.acts2.de`) — diese Datei enthält deshalb nur
# den HTTP-Server. Danach steht hier zusätzlich ein `listen 443 ssl` und die
# Weiterleitung von 80 nach 443.

# Ein Eimer für Anmeldeversuche und Schreibzugriffe. Das Backend hat einen
# eigenen Throttler (300/min), aber der zählt erst, nachdem die Anfrage durch
# Node gegangen ist. Diese Zone kostet nichts und greift davor.
limit_req_zone $binary_remote_addr zone=acts2_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.acts2.de;

    # Kopfbilder dürfen 10 MB haben (header-image.service.ts), Profilbilder 5 MB.
    # nginx' Vorgabe von 1 MB bräche jeden Upload mit einer HTML-Fehlerseite ab,
    # bevor die Anwendung ihre eigene, verständliche Meldung schicken kann.
    client_max_body_size 12m;

    # Kein `gzip on;` an dieser Stelle: Das Backend komprimiert selbst
    # (`compression()` in main.ts), eine zweite Stufe brächte nichts.
    #
    # Wichtiger ist, was hier *nicht* passieren darf: den `ETag` anfassen. Er
    # trägt die Versionsnummer des Datensatzes (`W/"7"`), kommt als `If-Match`
    # zurück und wird zur `WHERE version IN (…)` im UPDATE. Ersetzt ihn ein
    # Zwischenstück durch einen eigenen Wert, erkennt ihn `parseEtagVersion`
    # nicht wieder und jedes Speichern endet in 412. nginx lässt ihn im
    # Proxy-Betrieb unangetastet — deshalb steht hier nichts weiter, aber es ist
    # der Grund, warum vor dieser API auch kein CDN stehen sollte.
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Nicht Kür: main.ts setzt `trust proxy`, damit der Throttler echte
        # Client-IPs zählt. Ohne diesen Header sähe er nur die des Proxys und
        # zählte alle neun Leute als einen Aufrufer.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=acts2_api burst=30 nodelay;

        # Reicht für alles, was diese API tut. Die längste Anfrage ist ein
        # Gemini-Aufruf beim Lied-Anlegen; der Client selbst bricht nach 20 s ab.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
