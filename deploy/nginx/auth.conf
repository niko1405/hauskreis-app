# auth.acts2.de → Keycloak auf 127.0.0.1:8080
#
#   sudo cp deploy/nginx/auth.conf /etc/nginx/sites-available/acts2-auth
#   sudo ln -s /etc/nginx/sites-available/acts2-auth /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Der Name muss **exakt** dem `KEYCLOAK_URL` in .env.prod entsprechen: daraus
# wird `KC_HOSTNAME` für Keycloak und der Issuer, gegen den das Backend jedes
# Token prüft. Weicht er ab, endet jede Anfrage in 401.

# Die Anmeldeseite und die Admin-Konsole sind die einzigen Stellen, an denen
# Fremde etwas ausprobieren können. Keycloak bringt für Login-Versuche seine
# eigene Erkennung mit (setup-keycloak.sh schaltet sie ein); diese Zone deckelt
# davor die schiere Menge.
limit_req_zone $binary_remote_addr zone=acts2_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name auth.acts2.de;

    # Keycloak schickt beim Anmelden große Cookies zurück; die Vorgabe reicht
    # meist, aber nicht, wenn ein Token einmal viele Rollen trägt.
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak läuft mit KC_PROXY_HEADERS=xforwarded und baut aus diesen
        # Angaben die Adressen, die es in Weiterleitungen und in die
        # Discovery-Antwort schreibt. Fehlt X-Forwarded-Host, schickt es den
        # Browser mitten im Anmeldevorgang auf `keycloak:8080`.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        limit_req zone=acts2_auth burst=20 nodelay;
    }

    # Die Admin-Konsole und der Token-Endpunkt strenger. Beides sind Ziele, an
    # denen sich Ausprobieren lohnt, und beides braucht im Alltag keine hohe Rate:
    # neun Leute melden sich an, ein Administrator klickt gelegentlich.
    location ~ ^/(admin|realms/[^/]+/protocol/openid-connect/token) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        limit_req zone=acts2_auth burst=5 nodelay;
    }

    # Kein Suchmaschinen-Eintrag für die Anmeldeseite einer Gruppe von neun.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
