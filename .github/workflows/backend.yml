# Baut das API-Image und legt es in die GitHub Container Registry.
#
# Warum überhaupt: Auf dem VPS zu bauen hieße, neben Keycloak und zwei Postgres
# einen Node-Build mit vollem Abhängigkeitsbaum laufen zu lassen. Das geht meist
# gut und scheitert dann an dem Abend, an dem man es eilig hat. Hier gebaut,
# dort nur gezogen — und der Server braucht den Quelltext gar nicht mehr.
name: Backend-Image

on:
  push:
    branches: [main]
    paths:
      - "hauskreis-backend/**"
      - ".github/workflows/backend.yml"
  # Für den Fall, dass man ohne Codeänderung neu bauen will (Basis-Image mit
  # Sicherheitsupdates, abgelaufene Ebenen im Cache).
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kleingeschrieben, weil Registry-Namen das verlangen und ein
      # GitHub-Benutzername Großbuchstaben haben darf.
      - name: Image-Name bestimmen
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hauskreis-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: hauskreis-backend
          # Nur die Laufzeitstufe. Sie ist seit dem Umzug von `prisma` und
          # `dotenv` nach `dependencies` auch das Migrations-Image — der
          # `migrate`-Service im Prod-Compose ruft `prisma migrate deploy`
          # darauf auf.
          target: runtime
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Der sha-Tag ist der eigentliche Grund für zwei Tags: ein Rollback
          # ist damit `IMAGE_TAG=<alter-sha> docker compose up -d` und kein
          # Suchen im Verlauf.
          #
          # Das Paket heißt anders als das Repository (`hauskreis-backend` vs.
          # `hauskreis-app`). Ohne dieses Label taucht es auf der Repo-Seite
          # nicht auf und erbt auch dessen Sichtbarkeit nicht — man sucht es
          # dann in den Profil-Einstellungen.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ---------------------------------------------------------------------------
  # Ausrollen. Läuft erst, wenn das Image wirklich in der Registry liegt —
  # `needs: build` ist hier keine Kosmetik, sondern verhindert ein `pull` auf
  # einen Tag, den es noch nicht gibt.
  #
  # Der Server holt sich **die Sha dieses Laufs**, nicht `latest`. Zwei Pushes
  # kurz hintereinander würden sich sonst überholen und der zweite Deploy könnte
  # das Image des ersten ausrollen.
  #
  # Was hier an Zugang nötig ist, ist bewusst wenig: Der Schlüssel in
  # `DEPLOY_SSH_KEY` ist auf dem Server mit `command="…/deploy.sh"` gefesselt und
  # kann nichts anderes tun — auch wer ihn aus den Secrets zöge, bekäme keine
  # Shell. Einrichtung: deploy/README.md, „Automatisch ausrollen".
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Nur der echte Zweig, nie ein manueller Lauf auf einem anderen Stand.
    if: github.ref == 'refs/heads/main'
    # Trägt man in den Repository-Einstellungen unter Environments einen
    # Reviewer ein, wird aus dem automatischen Deploy einer auf Knopfdruck —
    # ohne dass hier etwas geändert werden muss.
    environment: produktion

    steps:
      - name: Schlüssel und bekannten Host hinterlegen
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Der Fingerabdruck steht im Secret, statt bei jedem Lauf frisch
          # geholt zu werden. `ssh-keyscan` würde jeden Host akzeptieren, der
          # gerade unter dem Namen antwortet — und damit genau die Prüfung
          # aushebeln, für die es known_hosts gibt.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ausrollen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "${{ github.sha }}"
