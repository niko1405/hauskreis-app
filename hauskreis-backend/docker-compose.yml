services:
  postgres:
    image: postgres:17-alpine
    container_name: hauskreis-postgres
    environment:
      POSTGRES_USER: hauskreis
      POSTGRES_PASSWORD: hauskreis
      POSTGRES_DB: hauskreis
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hauskreis -d hauskreis']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    container_name: hauskreis-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing mail locally so invitation emails can be inspected
  # instead of being delivered. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: hauskreis-mailpit
    ports:
      - '8025:8025'
      - '1025:1025'

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: hauskreis-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  keycloak-db-data:
