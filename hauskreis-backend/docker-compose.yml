# Entwicklungs-Umgebung: alles, was die App *umgibt*, aber nicht die App selbst.
# Die läuft mit `pnpm start:dev` auf dem Host, weil sie dort nach jeder
# Codeänderung in Sekunden neu startet statt in Minuten neu gebaut zu werden.
#
# Ausnahme ist das Profil `image` weiter unten — zum Prüfen des fertigen
# Produktions-Containers, nicht zum Entwickeln.
services:
  # Der Produktions-Container gegen die Dienste hier. Startet NICHT mit einem
  # gewöhnlichen `docker compose up -d`, sondern nur mit:
  #
  #   docker compose --profile image up -d --build api
  #
  # Gedacht zum Nachsehen, ob das Image tut, was es soll, bevor es irgendwo
  # deployt wird. Zum Entwickeln ist es der falsche Weg: jede Codeänderung
  # bräuchte einen neuen Build.
  #
  # Port 3030 auf dem Host, damit ein parallel laufendes `pnpm start:dev`
  # seinen Port 3000 behält. Im Container bleibt es 3000 — die Schreibweise
  # ist HOST:CONTAINER.
  api:
    profiles: ['image']
    build:
      context: .
      target: runtime
    container_name: hauskreis-api
    ports:
      - '127.0.0.1:3030:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hauskreis:hauskreis@postgres:5432/hauskreis?schema=public
      CORS_ORIGINS: http://localhost:3001
      # Öffentlich, wie im Token — von hier aus erreichbar über den Compose-Namen.
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: hauskreis
      KEYCLOAK_CLIENT_ID: hauskreis-backend
      KEYCLOAK_CLIENT_SECRET: local-dev-secret
      KEYCLOAK_AUDIENCE: hauskreis-backend
      KEYCLOAK_ALLOWED_AZP: hauskreis-app,hauskreis-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: hauskreis-postgres
    environment:
      POSTGRES_USER: hauskreis
      POSTGRES_PASSWORD: hauskreis
      POSTGRES_DB: hauskreis
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hauskreis -d hauskreis']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    container_name: hauskreis-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing mail locally so invitation emails can be inspected
  # instead of being delivered. Web UI: http://localhost:8025
  #
  # Only the web UI is published. Keycloak reaches SMTP over the compose network
  # as mailpit:1025, so exposing 1025 on the host would only invite stray
  # connections — those show up in the log as "500 5.5.2 Syntax error" from the
  # docker gateway IP and are unrelated to the invite flow.
  mailpit:
    image: axllent/mailpit:latest
    container_name: hauskreis-mailpit
    ports:
      - '8025:8025'

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: hauskreis-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      # Texte, Farben und Logo — keine Vorlagen; beide Themes erben ihre
      # .ftl-Dateien von Keycloak. Als Volume statt im Image, damit eine
      # Änderung einen Neustart kostet und keinen Neubau.
      - ./keycloak/themes/hauskreis:/opt/keycloak/themes/hauskreis:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  keycloak-db-data:
