# Production stack. Start with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Differs from the development compose in the ways that matter: Keycloak runs
# in production mode, nothing is published to the outside world except through
# a reverse proxy, and no credential is written down in this file.
#
# Der Server baut nichts. Das API-Image kommt fertig aus der CI
# (.github/workflows/backend.yml → GHCR); hier wird nur noch gezogen. Auf einem
# kleinen VPS neben Keycloak und zwei Postgres zu bauen ist eng, und ein Deploy
# soll nicht am Arbeitsspeicher scheitern. Wer doch lokal bauen will, hängt
# `--build` an und ergänzt `build: { context: ., target: runtime }`.

# Docker schreibt json-file-Logs unbegrenzt weiter. Ein Dienst, der monatelang
# durchläuft und pro Anfrage eine Zeile schreibt, füllt damit irgendwann die
# Platte — und das äußert sich zuerst als Datenbank, die nicht mehr schreiben
# kann. 3 × 10 MB pro Dienst reichen für die Fehlersuche und haben eine Obergrenze.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Applies pending migrations and exits, before the API is allowed to start.
  #
  # A separate step rather than something the app does on the way up: it makes
  # the ordering explicit, it fails loudly on its own instead of inside a boot
  # log, and if the app ever runs more than once there is no migration race to
  # reason about. Runs from the `build` stage, which has the schema and the
  # migrations folder.
  #
  # `migrate deploy` only applies what is already in prisma/migrations and never
  # generates or resets anything, so a restart is harmless.
  #
  # **Dasselbe Image wie `api`, nur ein anderes `command`.** Es war einmal ein
  # eigenes, weil `prisma` als devDependency im Runtime-Image fehlte; seit beide
  # unter `dependencies` stehen (siehe Dockerfile), gibt es nichts mehr zu
  # trennen — und die CI muss nur eines bauen und pushen.
  migrate:
    image: ${API_IMAGE:-ghcr.io/niko1405/hauskreis-backend}:${IMAGE_TAG:-latest}
    # Direkt der Binary, nicht `pnpm exec`: Im Image ist corepack zwar
    # eingeschaltet, aber pnpm selbst nicht entpackt — der erste `pnpm`-Aufruf
    # lädt es von registry.npmjs.org nach. Bei jedem Deploy. Ein Netzzugriff,
    # der nichts beiträgt und an dem Abend fehlschlägt, an dem npm hakt.
    command: node_modules/.bin/prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://hauskreis:${POSTGRES_PASSWORD}@postgres:5432/hauskreis?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/niko1405/hauskreis-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hauskreis:${POSTGRES_PASSWORD}@postgres:5432/hauskreis?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Die öffentliche Adresse: daraus wird der Issuer, und der muss dem `iss`
      # im Token entsprechen. Identisch mit KC_HOSTNAME unten.
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      # Der Weg dorthin von *hier* aus. Ohne das würde der Container die
      # Signaturschlüssel bei sich selbst suchen und jeder Request käme als 401
      # zurück — der häufigste Stolperstein beim Umzug von lokal nach Compose.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-hauskreis}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hauskreis-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-hauskreis-backend}
      KEYCLOAK_ALLOWED_AZP: ${KEYCLOAK_ALLOWED_AZP:-hauskreis-app}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-hauskreis-app}
      # Wohin die Einladungsmail zurückführt. Ohne das endet sie auf einer
      # Keycloak-Seite statt in der App.
      APP_URL: ${APP_URL}
      # Profilbilder. Muss auf ein Volume zeigen, sonst sind die Bilder nach
      # jedem `docker compose up` weg — und niemand lädt sein Bild zweimal hoch.
      UPLOAD_DIR: /data/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@hauskreis.local}
      # Die beiden Knöpfe beim Lied-Anlegen (Link lesen, Link suchen). Sie
      # fehlten hier, und das Ergebnis war kein Fehler, sondern etwas
      # Schlimmeres: die Knöpfe waren produktiv einfach nicht da, genau wie bei
      # jemandem, der bewusst keinen Schlüssel hinterlegt hat. Leer lassen ist
      # weiterhin ein gültiger Zustand.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # Never in production: it would let the CSV seed overwrite real data.
      SEED_ENABLED: 'false'
    # Bound to loopback — a reverse proxy terminates TLS and forwards. Exposing
    # 3000 to the world would serve the API over plain HTTP.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Profilbilder überleben damit einen Neustart und ein neues Image. Sie
      # gehören nicht in die Datenbank: ein Bild ist kein Datensatz, den man
      # abfragt, sondern ein Blob, den man ausliefert — in einer Spalte machte
      # er jede Personen-Abfrage schwerer und jedes Backup größer.
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # The app must not start against a schema that is one migration behind
      # the code it was built from.
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: hauskreis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hauskreis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # An den Loopback des Servers, nicht ans Netz. Im Alltag spricht nur die API
    # über das Compose-Netz mit der Datenbank; diese Zeile ist allein für den
    # SSH-Tunnel da, mit dem man von außen nachsieht:
    #
    #   ssh -N -L 5433:127.0.0.1:5432 <user>@<vps>
    #
    # Danach hängt lokal psql, DBeaver oder `prisma studio` auf 5433. Das ist
    # der Ersatz für ein pgAdmin: kein zweiter Dienst, kein zweites Login, kein
    # offener Port.
    #
    # Die Bindung an 127.0.0.1 ist der ganze Schutz und muss stehenbleiben.
    # Docker schreibt für veröffentlichte Ports eigene iptables-Regeln und geht
    # dabei an ufw vorbei — aus '5432:5432' würde eine im Internet erreichbare
    # Datenbank, ohne dass die Firewall es meldet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hauskreis -d hauskreis']
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    logging: *logging
    # `start`, not `start-dev`: enforces the hostname, expects a proxy in front
    # and refuses the shortcuts the dev mode allows.
    #
    # **Ohne `--optimized`**, obwohl das hier einmal stand. Der Flag verspricht
    # Keycloak, dass die Bauphase (`kc.sh build`) schon gelaufen ist — beim
    # allerersten Start ist sie das nicht, und Keycloak verweigert den Dienst mit
    # „The '--optimized' flag was used for first ever server start". Der
    # Container lief dann in einer Neustartschleife, und zwar genau einmal: beim
    # Aufsetzen. Ihn richtig zu nutzen hieße, ein eigenes Keycloak-Image zu bauen
    # und zu pflegen — für ein paar Sekunden Startzeit bei einem Dienst, der
    # monatelang durchläuft.
    #
    # Am Theme ändert das nichts: `kc.sh build` kümmert sich um Provider,
    # Datenbank und Features, Themes liest der Server zur Laufzeit.
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      # **Der Mailversand steht hier bewusst nicht.** Keycloak liest ihn nicht
      # aus der Umgebung, sondern aus der Realm-Konfiguration; Variablen an
      # dieser Stelle sähen nach Einrichtung aus und wären wirkungslos.
      #
      # Eingerichtet wird er mit `scripts/setup-keycloak.sh` (siehe README,
      # „Produktion"). Ohne ihn kommt **niemand** herein: der Realm verlangt eine
      # bestätigte Adresse, und ohne Mail gibt es keine Bestätigung.
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Dasselbe Theme wie in der Entwicklung. Es fehlte hier, und das fällt
      # nicht auf: ein Realm lässt sich auf ein Theme setzen, das es nicht gibt,
      # und Keycloak nimmt dann wortlos die Standardseite.
      #
      # `--optimized` ändert daran nichts — `kc.sh build` kümmert sich um
      # Provider, Datenbank und Features, Themes liest der Server zur Laufzeit.
      # Anders als im Entwicklungsmodus werden sie hier zwischengespeichert:
      # eine Änderung kostet einen Neustart des Dienstes.
      - ./keycloak/themes/hauskreis:/opt/keycloak/themes/hauskreis:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-db-data:
  uploads:
