# Kein Workspace. Die Datei steht hier, weil pnpm ab Version 11 nur noch an
# dieser Stelle liest, welche Pakete beim Installieren eigene Skripte ausführen
# dürfen — ohne eine Antwort bricht jedes `pnpm <befehl>` mit
# ERR_PNPM_IGNORED_BUILDS ab.
allowBuilds:
  # Prisma lädt seine Engines im Installationsskript. Ohne das gibt es keinen
  # Client und damit keinen Datenbankzugriff.
  '@prisma/engines': true
  prisma: true
  # Native Auflösung für oxlint.
  unrs-resolver: true
  # Kommen mit `@google/genai` herein und werden nicht gebraucht: das Paket
  # selbst hat als `preinstall` nur ein `echo`, und `protobufjs` gehört zum
  # Vertex-AI-Pfad. Wir sprechen mit der Gemini API über HTTP.
  '@google/genai': false
  protobufjs: false
  # Prismas Telemetrie-Ping. Sichtbar wurde er, als `prisma` von den
  # devDependencies zu den dependencies wanderte (damit `prisma migrate deploy`
  # im Produktions-Image läuft) — vorher wurde die Produktionsinstallation nie
  # danach gefragt, und `pnpm install --prod` brach dort mit
  # ERR_PNPM_IGNORED_BUILDS ab. Ausdrücklich `false`: das Skript meldet eine
  # Installation nach draußen, und dafür gibt es hier keinen Grund.
  '@scarf/scarf': false
