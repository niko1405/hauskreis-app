# Erbt von `base` — `parent=keycloak` brächte nichts, denn Keycloaks eigenes
# E-Mail-Theme besteht seinerseits nur aus `parent=base`. Ein gestaltetes
# Vorlagenpaket zum Erben gibt es schlicht nicht.
#
# Hier stand einmal, dass wir nur Texte ersetzen und keine .ftl-Dateien
# mitschleppen. Das galt, solange die Mails wie Browser-Standard aussehen
# durften. Für ein Aussehen reicht es nicht: Keycloak schickt den
# Nachrichtentext durch `kcSanitize()`, und das entfernt `style`-Attribute und
# `<style>`-Blöcke. Gestaltung, die in `messages_de.properties` steht, käme
# nackt an — sie muss in die Vorlage.
#
# Kopiert sind deshalb vier Dateien unter `html/`: der Rahmen und die drei
# Mails, die diese App verschickt. Beim Keycloak-Update gegen die neuen
# Fassungen halten, wie bei `login/info.ftl`. Die `text/`-Vorlagen bleiben
# geerbt.
parent=base
