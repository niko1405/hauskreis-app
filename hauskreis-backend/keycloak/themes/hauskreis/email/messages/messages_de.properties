# Die Mails, die Keycloak im Namen von Acts2 verschickt.
#
# Es sind genau drei: die Einladung in den Hauskreis, die Bestätigung einer
# Adresse (nach Registrierung und nach einem Adresswechsel) und das Zurücksetzen
# des Passworts. Das Backend selbst verschickt keine Mail.
#
# **Zwei Fassungen je Mail, und sie werden verschieden gebaut.**
#
# Die HTML-Fassung setzen die Vorlagen unter `html/` aus den Bausteinen
# `…Headline`, `…Intro`, `…Button` und `…Footnote` zusammen. Dort steht auch
# das Aussehen — es *muss* dort stehen: Keycloak schickt den Nachrichtentext
# durch `kcSanitize()`, und das entfernt `style`-Attribute. Was hier steht,
# sind Sätze, keine Gestaltung.
#
# Die Nur-Text-Fassung kommt aus Keycloaks geerbten `text/`-Vorlagen und liest
# weiterhin `…Body` am Stück. Deshalb stehen die alten Schlüssel unverändert
# darunter — sie sind nicht übrig geblieben, sie sind die zweite Fassung.
#
# **Die Platzhalter-Falle gilt nur noch für `…Body`.** Keycloak zählt die
# Argumente je Vorlage anders: Die lesbare Gültigkeit („7 Tage") ist bei
# Bestätigung und Passwort {3}, bei der Einladung {4} — dort schiebt sich die
# Liste der Schritte davor. Hier stand einmal überall {4}, und `MessageFormat`
# lässt einen Platzhalter, den es nicht füllen kann, kommentarlos stehen: In
# der Mail las man wörtlich „Der Link gilt {4}.". In den `…Footnote`-Texten
# kann das nicht mehr passieren — die Vorlagen übergeben genau ein Argument,
# und es ist immer {0}.
#
# **Und noch eine, aus derselben Familie: das Apostroph.** Jeder Text hier geht
# durch `MessageFormat`, und dort ist `'` das Escape-Zeichen. „Los geht's" kam
# als „Los gehts" an — keine Fehlermeldung, nur ein fehlender Buchstabe, den
# man in einer Knopfbeschriftung leicht überliest. Ein Apostroph muss deshalb
# verdoppelt werden: `Los geht''s`.
#
# Der Ton folgt CLAUDE.md §9: warm, persönlich, informell.

