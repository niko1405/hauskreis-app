# Die Mails, die Keycloak im Namen von Acts2 verschickt.
#
# Nur Texte, keine Vorlagen: das Theme erbt von `base`, und die Platzhalter
# stehen in derselben Reihenfolge wie dort. Überall gilt: {0} ist der Link,
# {1} seine Gültigkeit als blanke Zahl, {2} der Realm-Name.
#
# **Danach zählen die Vorlagen unterschiedlich weiter**, und das ist die Falle:
#
#   email-verification.ftl  ${msg(…, link, linkExpiration, realmName, formatter)}
#   password-reset.ftl      ${msg(…, link, linkExpiration, realmName, formatter)}
#   email-executeActions    ${msg(…, link, linkExpiration, realmName, requiredActions, formatter)}
#
# Die lesbare Gültigkeit („7 Tage") ist also bei den ersten beiden {3} und nur
# bei der Einladung {4} — dort schiebt sich die Liste der Schritte auf {3}
# davor. Hier stand einmal überall {4}; in Bestätigungs- und Passwortmail gibt
# es dieses Argument nicht, und `MessageFormat` lässt einen Platzhalter, den es
# nicht füllen kann, einfach stehen. In der Mail las man dann wörtlich
# „Der Link gilt {4}." — keine Fehlermeldung, nirgends, nur ein Satz, der
# kaputt aussieht.
#
# Der Ton folgt CLAUDE.md §9: warm, persönlich, informell.

emailVerificationSubject=Bestätige deine Adresse für Acts2
emailVerificationBody=Hi!\n\nBitte bestätige diese Adresse für Acts2, indem du auf den Link klickst:\n\n{0}\n\nDer Link gilt {3}.\n\nWenn du damit nichts anfangen kannst, ignoriere diese Mail einfach.
emailVerificationBodyHtml=<p>Hi!</p><p>Bitte bestätige diese Adresse für Acts2:</p><p><a href="{0}">Adresse bestätigen</a></p><p>Der Link gilt {3}. Wenn du damit nichts anfangen kannst, ignoriere diese Mail einfach.</p>

executeActionsSubject=Du bist bei Acts2 dabei
executeActionsBody=Hi!\n\nJemand aus dem Hauskreis hat dich eingeladen. Über diesen Link suchst du dir einen Nutzernamen aus, legst dein Passwort fest und bist dann direkt drin:\n\n{0}\n\nDer Link gilt {4}. Danach findest du unter derselben Adresse die Termine, wer wann hostet, die Themen und eure Gebetsbuddys.\n\nWenn du damit nichts anfangen kannst, ignoriere diese Mail einfach — ohne den Link passiert nichts.
executeActionsBodyHtml=<p>Hi!</p><p>Jemand aus dem Hauskreis hat dich eingeladen. Über diesen Link suchst du dir einen Nutzernamen aus, legst dein Passwort fest und bist dann direkt drin:</p><p><a href="{0}">Nutzernamen und Passwort festlegen</a></p><p>Der Link gilt {4}. Danach findest du dort die Termine, wer wann hostet, die Themen und eure Gebetsbuddys.</p><p>Wenn du damit nichts anfangen kannst, ignoriere diese Mail einfach — ohne den Link passiert nichts.</p>

passwordResetSubject=Neues Passwort für Acts2
passwordResetBody=Hi!\n\nDu (oder jemand anderes) hat ein neues Passwort für Acts2 angefordert. Hier entlang:\n\n{0}\n\nDer Link gilt {3}. Warst du das nicht, ignoriere diese Mail — dein Passwort bleibt, wie es ist.
passwordResetBodyHtml=<p>Hi!</p><p>Du (oder jemand anderes) hat ein neues Passwort für Acts2 angefordert:</p><p><a href="{0}">Neues Passwort setzen</a></p><p>Der Link gilt {3}. Warst du das nicht, ignoriere diese Mail — dein Passwort bleibt, wie es ist.</p>

# Die Namen der einzelnen Schritte, falls Keycloak sie auflistet.
requiredAction.UPDATE_PROFILE=Nutzernamen aussuchen
requiredAction.UPDATE_PASSWORD=Passwort festlegen
requiredAction.VERIFY_EMAIL=Adresse bestätigen
