# Dieselben Texte wie in `messages_de.properties` — als Rückfall für jede
# andere Sprache.
#
# **Warum es diese Datei gibt.** Keycloak baut das Nachrichtenbündel in zwei
# Durchgängen: erst Englisch für die ganze Theme-Kette, dann die tatsächlich
# gewünschte Sprache darüber. Fehlt die englische Fassung, existieren die
# eigenen Schlüssel nur, solange die Sprache wirklich `de` ist — und sonst
# druckt FreeMarker den Schlüssel selbst ab. In der Einladungsmail stand dann
# wörtlich „emailBrand", „executeActionsHeadline", „executeActionsButton".
#
# **Warum trotzdem Deutsch drinsteht.** Das ist keine Übersetzung, sondern ein
# Sicherungsnetz. Die App ist durchgehend deutsch, der Realm kennt nur `de`
# (`supportedLocales`), und eine englische Mail wäre für diese Gruppe kein
# Gewinn, sondern eine zweite Fassung, die niemand pflegt. Kommt eines Tages
# eine echte zweite Sprache dazu, ist hier ihr Platz.
#
# **Beide Dateien gehören zusammen.** Wer einen Text ändert, ändert ihn hier
# und in `messages_de.properties`. Dass das niemand vergisst, prüft
# `src/auth/keycloak-theme-messages.spec.ts` — die Schlüssel und ihre Werte
# müssen in beiden Dateien gleich sein. Die Erklärungen zu den Fallstricken
# (Platzhalter-Nummern, verdoppeltes Apostroph) stehen nur in der deutschen
# Datei; sie ist die, die man liest.

