# Die Seiten, auf denen Keycloak selbst mit den Menschen redet: Anmeldung,
# Nutzername und Passwort beim Einstieg, Passwort ändern, Adresse bestätigen.
#
# Im Grundsatz nur Farbe und Text: `parent=keycloak.v2` liefert die .ftl-Dateien,
# wir legen ein Stylesheet darüber. Eine kopierte Vorlage müsste man bei jedem
# Keycloak-Update gegen die neue halten; eine Handvoll CSS-Variablen überlebt
# Updates unbeaufsichtigt.
#
# Kopiert ist nur, was ein Stylesheet nicht kann, und jede Kopie sagt im Kopf,
# warum: terms.ftl (ein Kästchen statt zweier Knöpfe), login.ftl und
# register.ftl („Weiter mit Google" oben, und auf der Registrierung überhaupt —
# eine Reihenfolge dreht man nicht mit Farbe, einen fehlenden Knopf schon gar
# nicht). keycloak-theme-templates.spec.ts hält sie an die Keycloak-Version.
parent=keycloak.v2

# Beide Dateien, nicht nur unsere: `styles` ersetzt die Liste des Elternteils,
# statt sie zu ergänzen. Ohne css/styles.css fehlte das Grundgerüst der Seite.
styles=css/styles.css css/hauskreis.css

# Der Entwurf der App ist durchweg hell gedacht (globals.css: color-scheme
# light). Ein Dunkelmodus nur auf der Anmeldeseite wäre genau der Bruch, den
# dieses Theme vermeiden soll.
darkMode=false
