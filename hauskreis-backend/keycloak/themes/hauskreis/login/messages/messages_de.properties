# Die Texte auf den Anmeldeseiten.
#
# Keycloak bringt Deutsch schon mit, aber im Sie und in Verwaltungssprache
# („Benutzerkonto Informationen aktualisieren"). Hier stehen nur die Sätze,
# die man tatsächlich zu sehen bekommt — alles andere erbt weiter von
# keycloak.v2 und bleibt damit auch nach einem Update vollständig.
#
# Ton wie im Rest der App (CLAUDE.md §9): warm, persönlich, informell.
#
# **Ein Schlüssel, eine Stelle.** Die Datei ist flach: Java liest sie von oben
# nach unten, und bei zwei Zeilen mit demselben Namen gewinnt wortlos die
# untere. Genau das war hier passiert — `loginTitleHtml` stand oben auf „Acts2"
# und unten noch einmal, weshalb über der Karte auf **jeder** Seite etwas
# anderes stand als gedacht und der Name der App nirgends mehr auftauchte. Ein
# Fehler ohne Fehlermeldung. Beschriftungen, die auf mehreren Seiten vorkommen,
# stehen deshalb unten gesammelt und nirgends sonst.

# Kopf über der Karte, auf allen Seiten. Das Logo darüber kommt aus
# css/hauskreis.css.
loginTitleHtml=Acts2
loginTitle=Anmeldung bei Acts2

# ---------------------------------------------------------------- Anmelden
loginAccountTitle=Willkommen zurück
doLogIn=Anmelden
rememberMe=Angemeldet bleiben
doForgotPassword=Passwort vergessen?
invalidUserMessage=Das passt nicht zusammen. Nutzername oder Passwort stimmt nicht.

# ------------------------------------------------ Einladung: Zwischenseite
# Was man sieht, wenn man den Link aus der Mail öffnet: eine kurze Vorstellung,
# eine Liste dessen, was gleich kommt, und ein Knopf.
#
# `confirmExecutionOfActions` steht als Überschrift über der Karte **und** als
# erster Satz darin — Keycloaks info.ftl setzt beides aus derselben Nachricht.
# Deshalb ist der Satz kurz und die Vorstellung eine eigene Nachricht:
# `invitationIntro` (siehe login/info.ftl, wo sie eingesetzt wird).
confirmExecutionOfActions=Schön, dass du da bist
# Der Satz endet ohne Punkt: Keycloak hängt die Liste der Schritte mit einem
# Doppelpunkt direkt an („… das hier: Nutzernamen aussuchen, Passwort
# festlegen"). Ein Punkt davor risse den Satz mitten entzwei.
invitationIntro=Acts2 ist eine Hauskreis-App, die euren Hauskreis auf das nächste Level bringt: Planen von Terminen, Hosts, Themen, Lieder, Gebetsbuddys und vieles mehr. Der Name Acts2 ist inspieriert von der allerersten christlichen Gemeinschaft aus Apostelgeschichte 2 — dort wie hier geht es ums Miteinander. Viel Spaß beim Entdecken! Das hier kommt gleich auf dich zu:
proceedWithAction=Los geht's
doContinue=Weiter
requiredAction.UPDATE_PROFILE=Nutzernamen aussuchen
requiredAction.UPDATE_PASSWORD=Passwort festlegen
requiredAction.VERIFY_EMAIL=Adresse bestätigen
requiredAction.TERMS_AND_CONDITIONS=Rechtliches bestätigen

# -------------------------------------------- Nutzername und Name festlegen
# Der erste Schritt der Einladung. Das Nutzername-Feld gibt es nur, weil am
# Realm `editUsernameAllowed` steht (siehe scripts/setup-keycloak.sh).
loginProfileTitle=Wie sollen wir dich nennen?
doSubmit=Weiter
doCancel=Abbrechen

# ---------------------------------------------------------------- Passwort
updatePasswordTitle=Dein Passwort
passwordNew=Neues Passwort
passwordNewConfirm=Noch einmal zur Sicherheit

# ------------------------------------------------------------ Adresse bestätigen
emailVerifyTitle=Fast geschafft
emailVerifyInstruction1=Wir haben dir eine Mail an {0} geschickt. Klick auf den Link darin, dann bist du drin.
emailVerifyInstruction2=Keine Mail bekommen?
emailVerifyInstruction3=, um sie noch einmal zu schicken.
emailVerifyResend=Hier klicken
emailVerifySend=Mail schicken
# Die Seite **nach** dem Klick in der Mail. Der Weg zurück in die App steht
# darunter als „Zurück zu Acts2" — aber nur, weil der Client eine `baseUrl`
# kennt (scripts/setup-keycloak.sh). Ohne sie endete die Bestätigung auf einer
# Seite ohne Ausgang.
emailVerified=Deine Adresse ist bestätigt.

# ------------------------------------------------------------ Passwort vergessen
emailForgotTitle=Passwort vergessen
emailInstruction=Sag uns deine E-Mail-Adresse, dann schicken wir dir einen Link zum Zurücksetzen.
emailInstructionUsername=Sag uns deinen Nutzernamen, dann schicken wir dir einen Link zum Zurücksetzen.
backToLogin=Zurück zur Anmeldung

# ---------------------------------------------------------------- Hinweise
accountUpdatedMessage=Fertig. Du kannst dich jetzt bei Acts2 anmelden.
accountPasswordUpdatedMessage=Dein Passwort steht.
backToApplication=Zurück zu Acts2
pageExpiredTitle=Das hat zu lange gedauert
pageExpiredMsg1=Die Seite ist abgelaufen.
pageExpiredMsg2=Um von vorn anzufangen,
doClickHere=hier klicken
errorTitle=Da ist etwas schiefgelaufen

# ------------------------------------------------------------- Registrieren
# Der Weg für alle, die niemanden kennen, der schon drin ist. Nach dem Anlegen
# landet man in der App auf „Hauskreis gründen / eingeladen werden" — das Konto
# gehört zunächst zu keiner Gruppe, und das ist ein gültiger Zustand.
registerTitle=Konto anlegen
registerWithTitle=Konto anlegen
doRegister=Konto anlegen
noAccount=Noch kein Konto?
emailExistsMessage=Mit dieser Adresse gibt es schon ein Konto. Melde dich damit an.
usernameExistsMessage=Diesen Nutzernamen hat schon jemand. Nimm einen anderen.
invalidPasswordConfirmMessage=Die beiden Passwörter sind nicht gleich.
missingUsernameMessage=Da fehlt noch ein Nutzername.
missingEmailMessage=Da fehlt noch die E-Mail-Adresse.
missingPasswordMessage=Da fehlt noch ein Passwort.
invalidEmailMessage=Das sieht nicht nach einer E-Mail-Adresse aus.

# ----------------------------------------------- Beschriftungen der Felder
# Gelten überall, wo das Feld vorkommt — Anmeldung, Registrierung und der
# Profilschritt der Einladung teilen sich dieselben Schlüssel. Sie stehen
# deshalb hier und nicht bei den einzelnen Seiten: dort wären es drei Zeilen
# mit demselben Namen, und nur die letzte hätte gezählt.
usernameOrEmail=Nutzername oder E-Mail
# Der Nutzername steht später in der App auf jeder Karte — deshalb ein eigener
# Begriff und nicht „Login".
username=Nutzername
password=Passwort
passwordConfirm=Passwort wiederholen
email=E-Mail-Adresse
# Vor- und Nachname verlangt Keycloak beim Registrieren; gebraucht werden sie
# in der App nicht. Die Beschriftungen bleiben trotzdem freundlich.
firstName=Vorname
lastName=Nachname

# ------------------------------------------------------- Einwilligung (Art. 9)
# Die Seite, die vor der ersten Anmeldung steht — bei der Selbstregistrierung
# genauso wie beim Einstieg über einen Einladungslink.
#
# Der Satz ist in drei Bausteine geteilt, weil mitten darin ein Link steht. Ihn
# als `<a>` in den Text zu schreiben ginge auch, aber `kcSanitize` entfernt
# `target` — und ein Link, der die Anmeldung verlässt, statt einen Tab zu
# öffnen, kostet den halb ausgefüllten Vorgang.
termsTitle=Kurz noch etwas Rechtliches
termsIntro=Acts2 ist ein privates, nicht-kommerzielles Projekt für Hauskreise. Es kostet nichts, verkauft nichts und zeigt keine Werbung. Du benutzt es auf eigene Verantwortung; für Ausfälle oder verlorene Eintragungen wird nicht gehaftet. Halte dich an geltendes Recht und geh mit dem, was andere hier schreiben, so um, wie du es dir umgekehrt wünschst.
termsConsentBefore=Ich akzeptiere die Nutzungsbedingungen und willige ausdrücklich ein, dass meine Daten im christlichen/religiösen Kontext gemäß der
termsConsentAfter=verarbeitet werden.
doAccept=Akzeptieren
doDecline=Ablehnen

# ------------------------------------------------------------------ Fußzeile
# Steht unter jeder Anmeldeseite (login/footer.ftl). Die Adressen selbst
# stehen dort, nicht hier — ein Theme kennt keine Umgebungsvariablen.
legalPrivacy=Datenschutzerklärung
legalImprint=Impressum
