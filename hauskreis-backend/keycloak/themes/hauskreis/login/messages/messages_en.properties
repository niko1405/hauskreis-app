# Dieselben Texte wie in `messages_de.properties` — als Rückfall für jede
# andere Sprache.
#
# **Warum es diese Datei gibt.** Keycloak baut das Nachrichtenbündel in zwei
# Durchgängen: erst Englisch für die ganze Theme-Kette, dann die tatsächlich
# gewünschte Sprache darüber. Fehlt die englische Fassung, gelten die eigenen
# Texte nur, solange die Sprache wirklich `de` ist. Auf den Anmeldeseiten fällt
# das weicher aus als bei den Mails — dort stünden Keycloaks eigene Sätze im
# Sie statt der unsrigen —, es ist aber derselbe Fehler, und er gehört an
# beiden Stellen geschlossen.
#
# **Warum trotzdem Deutsch drinsteht.** Das ist keine Übersetzung, sondern ein
# Sicherungsnetz. Die App ist durchgehend deutsch, der Realm kennt nur `de`
# (`supportedLocales`), und eine halbe englische Oberfläche wäre kein Gewinn.
# Kommt eines Tages eine echte zweite Sprache dazu, ist hier ihr Platz.
#
# **Beide Dateien gehören zusammen.** Wer einen Text ändert, ändert ihn hier
# und in `messages_de.properties`. Dass das niemand vergisst, prüft
# `src/auth/keycloak-theme-messages.spec.ts` — die Schlüssel und ihre Werte
# müssen in beiden Dateien gleich sein. Die Erklärungen dazu, welcher Text auf
# welcher Seite steht, stehen nur in der deutschen Datei; sie ist die, die man
# liest.

